apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager-webhook-netcup
  namespace: flux-system
spec:
  interval: 1h
  releaseName: cert-manager-webhook-netcup
  targetNamespace: cert-manager
  chart:
    spec:
      chart: cert-manager-webhook-netcup
      version: "1.1.5"
      sourceRef:
        kind: HelmRepository
        name: netcup-webhook
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
