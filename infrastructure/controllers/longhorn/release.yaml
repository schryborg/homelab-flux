apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: longhorn-system
  chart:
    spec:
      chart: longhorn
      version: "v1.13.0"
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    persistence:
      defaultClass: false
    csi:
      kubeletRootDir: /var/lib/rancher/k3s/agent/kubelet

