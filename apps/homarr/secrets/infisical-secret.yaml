# Syncs secrets from Infisical into the homarr namespace.
# Requires the Infisical secrets operator to be deployed first.
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: homarr-secrets
  namespace: homarr
spec:
  infisicalAuthRef:
    name: default
    namespace: infisical-operator
  sources:
    - projectSlug: flux-j-tb-1
      environmentSlug: prod
      secretPath: /homarr
  syncOptions:
    refreshInterval: 1m
  targets:
    - kind: Secret
      name: homarr-infisical-secrets
      namespace: homarr
      creationPolicy: Owner
