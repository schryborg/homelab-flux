---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homarr-secrets
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./apps/homarr/secrets
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homarr
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./apps/homarr/app
  prune: true
  wait: true
  dependsOn:
    - name: homarr-secrets
  sourceRef:
    kind: GitRepository
    name: flux-system
