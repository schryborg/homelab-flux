apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
    headerStyle: clean
  settings.yaml: ""
  #settings.yaml: |
  #  providers:
  #    longhorn:
  #      url: https://longhorn.my.network
  custom.css: ""
  custom.js: ""
  bookmarks.yaml: |
    - Developer:
        - Github:
            - abbr: GH
              href: https://github.com/
  services.yaml: |
    - Management:
        - OPNSense:
            icon: opnsense
            href: https://192.168.1.1
        - Technitium:
            icon: technitium
            href: http://192.168.50.30:5380
        - Proxmox:
            icon: proxmox.png
            href: https://192.168.1.11:8006
            widget:
              type: proxmox
              url: https://192.168.1.11:8006
              username: {{HOMEPAGE_VAR_PROXMOX_USERNAME}}
              password: {{HOMEPAGE_VAR_PROXMOX_PASSWORD}}
              # node: pve01 # optional
        - Proxmox Backup Server:
            icon: proxmox.png
            href: https://192.168.1.246:8007
            # widget:
            #     type: proxmoxbackupserver
            #     url: https://192.168.1.90:8007
            #     username:
            #     password:
        - PeaNUT:
            icon: peanut
            href: https://peanut.schryborg.de
            widget:
              type: peanut
              url: https://peanut.schryborg.de
              key: eaton
        - NUT-Server:
            icon: nut.png
            href: http://192.168.1.10/cgi-bin/nut/upsstats.cgi
        - Unraid:
            icon: unraid.png
            href: http://192.168.1.101
        - Beszel:
            icon: beszel.png
            href: https://beszel.schryborg.de
        - UniFi Network:
            icon: ubiquiti.png
            href: https://192.168.50.7:8443
        - Authentik:
            icon: authentik.png
            href: https://authentik.schryborg.de
            # widget:
            #     type: authentik
            #     url: https://authentik.schryborg.de
            #     key:
    - Services:
        - Home Assistant:
            icon: home-assistant.png
            href: https://hass.schryborg.de
        - Zigbee2Mqtt:
            icon: zigbee2mqtt.png
            href: https://zigbee.schryborg.de/
        - ESPHome:
            icon: esphome.png
            href: https://esphome.schryborg.de
        - Paperless:
            icon: paperless.png
            href: https://paperless.schryborg.de
            widget:
              type: paperlessngx
              url: https://paperless.schryborg.de
              key: {{HOMEPAGE_VAR_PAPERLESS_KEY}}
        - Nextcloud:
            icon: /icons/nextcloud-hasi.png
            href: https://cloud.schryborg.de
        - Mealie:
            icon: mealie.png
            href: https://mealie.schryborg.de
        - Vaultwarden:
            icon: bitwarden.png
            href: https://vaultwarden.schryborg.de
        - Vikunja:
            icon: vikunja.png
            href: https://vikunja.schryborg.de
        - Timetagger:
            icon: /icons/timetagger.png
            href: https://timetagger.schryborg.de
        - Prusa Link:
            icon: prusa-research.svg
            href: http://192.168.1.60
        - Manyfold:
            icon: manyfold.png
            href: https://manyfold.schryborg.de
        - Guest-Wifi:
            icon: /icons/wifi.png
            href: http://guest-wifi.schryborg.de
    - Media:
        - Immich:
            icon: immich.png
            href: https://immich.schryborg.de
            # widget:
            #     type: immich
            #     url: https://immich.schryborg.de/
            #     key:
        - Jellyfin:
            icon: jellyfin.png
            href: https://jellyfin.schryborg.de
            widget:
              type: jellyfin
              url: https://jellyfin.schryborg.de
              key: {{HOMEPAGE_VAR_JELLYFIN_KEY}}
              enableBlocks: true # optional, defaults to false
              enableNowPlaying: true # optional, defaults to true
        # - Jellystat:
        #     icon: jellystat.png
        #     href: https://jellystat.schryborg.de
        - METube:
            icon: metube.png
            href: https://metube.schryborg.de
    - Tools:
        - Forgejo:
            icon: forgejo.png
            href: https://forgejo.schryborg.de
        - Flatnotes:
            icon: flat-notes.png
            href: https://flatnotes.schryborg.de
        - PDF:
            icon: stirling-pdf.png
            href: https://pdf.schryborg.de
        - QR Generator:
            icon: /icons/qr.png
            href: https://qr.schryborg.de
  widgets.yaml: |
    - datetime:
        text_size: xl
        format:
          timeStyle: short
          hourCycle: h23
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    # - resources:
    #     backend: resources
    #     expanded: true
    #     cpu: true
    #     memory: true
    #     network: default
    - search:
        provider: duckduckgo
        target: _blank
    - openmeteo:
        label: Rasdorf # optional
        latitude: 50.717089390423894
        longitude: 9.90297425561126
        timezone: Europe/Berlin # optional
        units: metric # or imperial
        cache: 5 # Time in minutes to cache API responses, to stay within limits
        format: # optional, Intl.NumberFormat options
          maximumFractionDigits: 1
  docker.yaml: ""
  proxmox.yaml: ""
