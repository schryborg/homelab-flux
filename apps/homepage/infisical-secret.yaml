# Syncs secrets from Infisical into the homepage namespace.
# Requires the Infisical secrets operator to be deployed first.
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: homepage-secrets
  namespace: homepage
spec:
  infisicalAuthRef:
    name: default
    namespace: infisical-operator
  sources:
    - projectId: 4ca8a2e4-143f-46f7-9769-8e2899f10c2f
      environmentSlug: prod
      secretPath: /homepage
  syncOptions:
    refreshInterval: 1m
  targets:
    - kind: Secret
      name: homepage-infisical-secrets
      namespace: homepage
      creationPolicy: Owner
