---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infisical-redis
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./apps/infisical/redis
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infisical-app
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./apps/infisical/app
  prune: true
  wait: true
  dependsOn:
    - name: infisical-redis
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infisical-operator
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./apps/infisical/operator
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infisical-operator-config
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./apps/infisical/operator-config
  prune: true
  wait: true
  dependsOn:
    - name: infisical-operator
  sourceRef:
    kind: GitRepository
    name: flux-system
