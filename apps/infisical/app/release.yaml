apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: infisical
  namespace: flux-system
spec:
  interval: 1h
  releaseName: infisical
  targetNamespace: infisical
  chart:
    spec:
      chart: infisical-standalone
      version: "1.11.1"
      sourceRef:
        kind: HelmRepository
        name: infisical
        namespace: flux-system
  values:
    infisical:
      fullnameOverride: infisical
      image:
        tag: "v0.167.0"
      replicaCount: 1
      kubeSecretRef: infisical-secrets
    ingress:
      enabled: false
      nginx:
        enabled: false
    postgresql:
      enabled: false
      useExistingPostgresSecret:
        enabled: true
        existingConnectionStringSecret:
          name: infisical-db-app #auto-generated by the cnpg cluster: name (infisical-db)+ -app-suffix
          key: uri
    redis:
      enabled: false
