# Syncs secrets from Infisical into the kestra namespace.
# Requires the Infisical secrets operator to be deployed first.
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: kestra-secrets
  namespace: kestra
spec:
  infisicalAuthRef:
    name: default
    namespace: infisical-operator
  sources:
    - projectSlug: flux-j-tb-1
      environmentSlug: prod
      secretPath: /kestra
  syncOptions:
    refreshInterval: 1m
  targets:
    - kind: Secret
      name: kestra-infisical-secrets
      namespace: kestra
      creationPolicy: Owner
