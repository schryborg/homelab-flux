---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kestra-secrets
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./apps/kestra/secrets
  prune: true
  wait: true
  dependsOn:
    - name: infisical-operator-config
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthCheckExprs:
    - apiVersion: secrets.infisical.com/v1beta1
      kind: InfisicalStaticSecret
      current: >-
        has(status.conditions) &&
        status.conditions.exists(
          c,
          c.type == 'secrets.infisical.com/LastReconcileStatus' &&
          c.status == 'True'
        )
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kestra
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./apps/kestra/app
  prune: true
  wait: true
  dependsOn:
    - name: kestra-secrets
  sourceRef:
    kind: GitRepository
    name: flux-system
