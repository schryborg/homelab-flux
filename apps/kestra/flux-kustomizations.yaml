---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kestra-secrets
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./apps/kestra/secrets
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kestra
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./apps/kestra/app
  prune: true
  wait: true
  dependsOn:
    - name: kestra-secrets
  sourceRef:
    kind: GitRepository
    name: flux-system
