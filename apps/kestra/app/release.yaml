apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kestra
  namespace: flux-system
spec:
  interval: 1h
  install:
    timeout: 15m
  upgrade:
    timeout: 15m
  releaseName: kestra #default: kestra-kestra -> <targetNamespace>-<HelmRelease>
  targetNamespace: kestra
  chart:
    spec:
      chart: kestra
      version: "2.0.6"
      sourceRef:
        kind: HelmRepository
        name: kestra
        namespace: flux-system
  values:
    common:
      replicas: 1
      startupProbe:
        periodSeconds: 10
        timeoutSeconds: 3
        failureThreshold: 60
      strategy:
        type: Recreate
      extraVolumes:
        - name: kestra-storage
          persistentVolumeClaim:
            claimName: kestra-storage
      extraVolumeMounts:
        - name: kestra-storage
          mountPath: /app/storage
      extraEnvFrom:
        - secretRef:
            name: kestra-infisical-secrets
    configurations:
      application:
        kestra:
          storage:
            type: local
            local:
              basePath: /app/storage
          queue:
            type: postgres
          repository:
            type: postgres
        datasources:
          postgres:
            url: jdbc:postgresql://kestra-db-rw:5432/kestra-db
            driverClassName: org.postgresql.Driver
            username: ${POSTGRES_USER}
            password: ${POSTGRES_PASSWORD}
