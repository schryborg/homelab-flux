apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kestra
  namespace: kestra
spec:
  ingressClassName: traefik
  rules:
    - host: kestra.k3s.schryborg.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kestra
                port:
                  number: 8080
